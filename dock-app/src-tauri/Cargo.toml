[package]
name = "leme"
version = "0.1.0"
description = "Leme Desktop - Ultraleve em Tauri v2 + Rust"
authors = ["Leme"]
edition = "2021"

[features]
# Embeds the built frontend instead of loading devUrl. The Tauri CLI enables this on
# `tauri build`; without it every build (even release) points at http://localhost:5175.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Storage_Streams"] }
