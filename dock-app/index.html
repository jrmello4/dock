<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimoDock Desktop</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Biblioteca de Símbolos e Gradientes Vetoriais (Zero-I/O, GPU-accelerated) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="gFinder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1e7ce0"/></linearGradient>
      <linearGradient id="gSafari" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f7ff"/><stop offset="1" stop-color="#cfe0f5"/></linearGradient>
      <linearGradient id="gTerm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f5c"/><stop offset="1" stop-color="#171a22"/></linearGradient>
      <linearGradient id="gNotes" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#f7c948"/></linearGradient>
      <linearGradient id="gMusic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a90"/><stop offset="1" stop-color="#e8305f"/></linearGradient>
      <linearGradient id="gMail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc3ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient>
      <linearGradient id="gCode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#4b31c9"/></linearGradient>
      <linearGradient id="gChat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ce07a"/><stop offset="1" stop-color="#17a94a"/></linearGradient>
      <linearGradient id="gFolder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc9ff"/><stop offset="1" stop-color="#2b8bdd"/></linearGradient>
      <linearGradient id="gTrash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe5ef"/><stop offset="1" stop-color="#9aa3b4"/></linearGradient>
      <linearGradient id="gSettings" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e96a8"/><stop offset="1" stop-color="#454b59"/></linearGradient>
      <linearGradient id="gStart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
      <linearGradient id="gSheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="gShell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3b45"/><stop offset="1" stop-color="#17171c"/></linearGradient>
      <linearGradient id="gShellTimer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3d3d"/><stop offset="1" stop-color="#171717"/></linearGradient>
      <linearGradient id="gShellClock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3240"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
      <linearGradient id="gShellMusic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb5c74"/><stop offset="1" stop-color="#fa233b"/></linearGradient>
      <linearGradient id="gShellNote" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#f2c02e"/></linearGradient>
      <linearGradient id="artSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd18a"/>
        <stop offset=".55" stop-color="#f08a6c"/>
        <stop offset="1" stop-color="#2e4a7d"/>
      </linearGradient>
    </defs>

    <!-- App Icons -->
    <symbol id="i-start" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="#171b26"/>
        <rect x="13" y="13" width="17" height="17" rx="3.5" fill="#38bdf8"/>
        <rect x="34" y="13" width="17" height="17" rx="3.5" fill="#0ea5e9"/>
        <rect x="13" y="34" width="17" height="17" rx="3.5" fill="#0284c7"/>
        <rect x="34" y="34" width="17" height="17" rx="3.5" fill="#2563eb"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)" opacity=".45"/>
      </g>
    </symbol>

    <symbol id="i-finder" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gFinder)"/>
        <path d="M32 3h15a15 15 0 0 1 15 15v28a15 15 0 0 1-15 15H32z" fill="#f2f8ff" opacity=".93"/>
        <circle cx="21" cy="26" r="2.6" fill="#0d2b52"/><circle cx="43" cy="26" r="2.6" fill="#0d2b52"/>
        <path d="M20 42q12 8 24 0" stroke="#0d2b52" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)"/>
      </g>
    </symbol>

    <symbol id="i-browser" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gSafari)"/>
        <circle cx="32" cy="32" r="22" fill="#1b6fd0"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#fff" stroke-opacity=".5"/>
        <path d="M44 20 26 29l-6 15 18-9z" fill="#ff4a5e"/>
        <path d="M38 35 26 29l12 6z" fill="#fff" opacity=".85"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)"/>
      </g>
    </symbol>

    <symbol id="i-terminal" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gTerm)"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)" opacity=".55"/>
        <path d="M15 28l9 7-9 7" stroke="#7bf59a" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M30 44h18" stroke="#e7ecf5" stroke-width="3.4" stroke-linecap="round"/>
      </g>
    </symbol>

    <symbol id="i-notes" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gNotes)"/>
        <rect x="2" y="2" width="60" height="13" rx="15" fill="#fff" opacity=".55"/>
        <g stroke="#b98e14" stroke-width="2.6" stroke-linecap="round" opacity=".75">
          <path d="M16 26h32"/><path d="M16 35h32"/><path d="M16 44h20"/>
        </g>
      </g>
    </symbol>

    <symbol id="i-music" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gMusic)"/>
        <path d="M42 15v24a7 7 0 1 1-4-6.3V24l-14 3.4v17a7 7 0 1 1-4-6.3V22z" fill="#fff"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)"/>
      </g>
    </symbol>

    <symbol id="i-mail" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gMail)"/>
        <rect x="13" y="20" width="38" height="25" rx="4" fill="#fff"/>
        <path d="m13 24 19 13 19-13" stroke="#1f6fe0" stroke-width="3" fill="none" stroke-linejoin="round"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)"/>
      </g>
    </symbol>

    <symbol id="i-photos" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="#fbfcff"/>
        <g opacity=".92">
          <circle cx="32" cy="20" r="9" fill="#ffd23f"/><circle cx="43" cy="26" r="9" fill="#ff7a45"/>
          <circle cx="43" cy="38" r="9" fill="#ef4d7a"/><circle cx="32" cy="44" r="9" fill="#9a63f0"/>
          <circle cx="21" cy="38" r="9" fill="#37a8f0"/><circle cx="21" cy="26" r="9" fill="#3ecf8e"/>
        </g>
        <circle cx="32" cy="32" r="7" fill="#fff" opacity=".65"/>
      </g>
    </symbol>

    <symbol id="i-code" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gCode)"/>
        <path d="M24 22 13 32l11 10M40 22l11 10-11 10" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M35 19 29 45" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".6"/>
      </g>
    </symbol>

    <symbol id="i-chat" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gChat)"/>
        <path d="M32 16c11 0 19 6.6 19 14.8S43 45.6 32 45.6a25 25 0 0 1-6-.7l-9 4 2.4-7.6c-3.9-2.8-6.4-6.8-6.4-11.3C13 22.6 21 16 32 16z" fill="#fff"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)"/>
      </g>
    </symbol>

    <symbol id="i-design" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="#15171f"/>
        <circle cx="25" cy="21" r="8" fill="#ff5c5c"/><circle cx="39" cy="21" r="8" fill="#ffc14d"/>
        <circle cx="25" cy="35" r="8" fill="#7be08f"/><circle cx="39" cy="35" r="8" fill="#5b8cff"/>
        <circle cx="32" cy="48" r="8" fill="#c58bff"/>
      </g>
    </symbol>

    <symbol id="i-folder" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <path d="M6 18a5 5 0 0 1 5-5h12l5 6h20a5 5 0 0 1 5 5v22a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z" fill="url(#gFolder)"/>
        <path d="M6 24h52v3H6z" fill="#fff" opacity=".28"/>
        <path d="M28 30v13m0 0-6-6m6 6 6-6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
      </g>
    </symbol>

    <symbol id="i-trash" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <path d="M18 20h28l-3 32a5 5 0 0 1-5 4.5H26a5 5 0 0 1-5-4.5z" fill="url(#gTrash)"/>
        <rect x="15" y="15" width="34" height="5" rx="2.5" fill="#cbd2de"/>
        <rect x="27" y="10" width="10" height="5" rx="2.5" fill="#cbd2de"/>
        <g stroke="#7b8494" stroke-width="2" stroke-linecap="round" opacity=".8">
          <path d="M27 28v20"/><path d="M32 28v20"/><path d="M37 28v20"/>
        </g>
      </g>
    </symbol>

    <symbol id="i-settings" viewBox="0 0 64 64">
      <g transform="translate(32 32) scale(0.8583) translate(-32 -32)">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gSettings)"/>
        <circle cx="32" cy="32" r="10" fill="none" stroke="#fff" stroke-width="4.2"/>
        <path d="M32 13v5M32 46v5M13 32h5M46 32h5M18.6 18.6l3.5 3.5M41.9 41.9l3.5 3.5M45.4 18.6l-3.5 3.5M22.1 41.9l-3.5 3.5" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
        <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#gSheen)" opacity=".45"/>
      </g>
    </symbol>
  </svg>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
